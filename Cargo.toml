[package]
name = "protwo"
version = "1.0.0"
edition = "2021"
description = "Makes the Nintendo Switch 2 Pro Controller usable over USB on Windows, through DirectInput or XInput"
license = "MIT"
readme = "README.md"
keywords = ["switch2", "controller", "gamepad", "windows", "vigem"]
categories = ["hardware-support", "game-development"]

[dependencies.windows-sys]
# 0.59 ships prebuilt import libraries, so both the MSVC and the GNU
# toolchains build without extra tools (0.60+ needs dlltool on GNU).
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_Usb",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
]

[features]
# The developer tools: `protwo record` and `protwo render`.
tools = ["windows-sys/Win32_Media", "windows-sys/Win32_Media_Audio"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
